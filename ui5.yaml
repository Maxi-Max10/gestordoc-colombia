# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "3.1"
metadata:
  name: gestordoccolombia
type: application
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertError: false # If set to true, certificate errors will be ignored. E.g. self-signed certificates will be accepted
        ui5:
          path:
            - /resources
            - /test-resources
          url: https://ui5.sap.com
        backend:
          - scp: true
            path: /odata
            url: https://api17preview.sapsf.com
            destination: SSFF_API
          - path: /cpi-term-fijo
            url: https://e0980-iflmap.hcisbt.us2.hana.ondemand.com
            destination: CPI_DOCUSIGN_DESTINATION
            pathReplace: /http/term-fijo
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        component: gestordoccolombia
        ui5Theme: sap_horizon
